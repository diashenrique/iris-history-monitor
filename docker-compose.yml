# Local instance with the module installed by IPM (see Dockerfile).
#   docker compose up -d --build
# Interface: http://localhost:52773/historymonitor/index.html  (user _SYSTEM, password SYS: change it)
services:
  iris:
    build: .
    container_name: iris-history-monitor
    restart: unless-stopped
    ports:
      - "${IRIS_PORT:-52773}:52773"
      - "${IRIS_SUPERSERVER_PORT:-1972}:1972"
    volumes:
      # The repository, to reload changes with: zn "IRISMONITOR"  zpm "load /home/irisowner/dev"
      - ./:/home/irisowner/dev
