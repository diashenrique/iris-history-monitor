name: ci
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contract JSON matches the YAML
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --user --break-system-packages pyyaml
          python3 scripts/openapi_to_json.py
          git diff --exit-code -- specs/001-api-v1/contracts/openapi.json

      - name: Start IRIS Community
        run: |
          set +e
          # intersystemsdc `latest` (2026.1) starts fine, but its docker-entrypoint.sh runs an after-start
          # script that fails (dbapi.connect) and shuts IRIS down. Calling iris-main directly skips that script.
          # (The 2020.2 tag from the Dockerfile does not start on current runner kernels; the official
          # containers.intersystems.com tag tried earlier could not be pulled.)
          # TZ: the tests run outside UTC on purpose. History rows are keyed in UTC while DateTime is local,
          # and $ZDateTime time format 7 converts local to UTC; on a UTC server those mistakes are invisible.
          docker run -d --name iris -e TZ=America/Sao_Paulo --entrypoint /tini -v "$PWD":/home/irisowner/repo \
            intersystemsdc/iris-community:latest -- /iris-main
          # ready = the container is running and `iris session` no longer reports "inhibited"
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' iris)" != "true" ]; then
              echo "IRIS container exited" >&2; exit 1
            fi
            out=$(docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' 2>&1)
            echo "probe $i: exit=$? ${out:0:80}"
            if [ -z "$out" ] || ! echo "$out" | grep -qi "inhibited\|not running\|error"; then
              docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' >/dev/null 2>&1 && exit 0
            fi
            sleep 2
          done
          echo "IRIS did not become ready in 180 s" >&2
          exit 1

      - name: Load source and run %UnitTest
        run: |
          set +e
          docker exec iris iris session IRIS -U USER \
            '##class(%SYSTEM.OBJ).LoadDir("/home/irisowner/repo/src/cls","ck",,1)' > load.txt 2>&1
          echo "load exit code: $?" >> load.txt
          docker exec iris iris session IRIS -U USER \
            '##class(diashenrique.historymonitor.test.Runner).Run()' > out.txt 2>&1
          echo "run exit code: $?" >> out.txt
          grep -v -E '^(Loading|Imported|Compiling)' load.txt | tail -c 2000 > load.short
          cat load.short out.txt
          msg="$(cat load.short; echo ---; grep -E '^(FAILED_METHOD|TEST_METHODS)' out.txt | tail -n 60)"
          echo "::notice title=unit test log::$(printf '%s' "$msg" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          grep -q "TEST_METHODS=[1-9][0-9]* FAILED_COUNT=0" out.txt

      - name: Container diagnostics
        if: failure()
        run: |
          {
            echo "== docker ps -a"; docker ps -a
            echo "== inspect state"; docker inspect iris --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}'
            echo "== logs"; docker logs --tail 60 iris 2>&1
            echo "== host"; free -m; df -h / | tail -1
          } > diag.txt 2>&1 || true
          cat diag.txt
          echo "::notice title=container diagnostics::$(tail -c 6000 diag.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"

  ipm-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start IRIS Community
        run: |
          set +e
          docker run -d --name iris --entrypoint /tini -v "$PWD":/home/irisowner/repo \
            intersystemsdc/iris-community:latest -- /iris-main
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' iris)" != "true" ]; then
              echo "IRIS container exited" >&2; exit 1
            fi
            out=$(docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' 2>&1)
            if [ -z "$out" ] || ! echo "$out" | grep -qi "inhibited\|not running\|error"; then
              docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' >/dev/null 2>&1 && exit 0
            fi
            sleep 2
          done
          echo "IRIS did not become ready in 180 s" >&2
          exit 1

      - name: Install IPM, load module.xml, check what was created
        run: |
          set +e
          # IPM is pinned so a new release cannot change this job by itself.
          curl -sSL -f -o zpm.xml https://pm.community.intersystems.com/packages/zpm/0.10.9/installer || { echo "could not download IPM" >&2; exit 1; }
          docker cp zpm.xml iris:/tmp/zpm.xml
          {
            docker exec iris iris session IRIS -U %SYS '##class(%SYSTEM.OBJ).Load("/tmp/zpm.xml","c")'
            docker exec iris iris session IRIS -U USER '##class(%IPM.Main).Shell("load /home/irisowner/repo")'
            docker exec iris iris session IRIS -U %SYS '##class(%SYSTEM.OBJ).Load("/home/irisowner/repo/.github/ci/InstallCheck.cls","ck")'
            docker exec iris iris session IRIS -U %SYS '##class(ci.InstallCheck).Run()'
          } > ipm.txt 2>&1
          # keep only printable text; the raw IPM output carries control characters that break annotations
          sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' ipm.txt | tr -cd '\11\12\40-\176' | grep -E '^(PASS|FAIL|INSTALL_CHECK|\[USER\|iris-history-monitor\].*(FAIL|ERROR))' | cut -c1-200 > summary.txt
          cat summary.txt
          echo "::notice title=ipm install check::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' summary.txt)"
          grep -q '^INSTALL_CHECK=OK' summary.txt
