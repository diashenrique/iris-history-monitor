name: ci
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contract JSON matches the YAML
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --user --break-system-packages pyyaml
          python3 scripts/openapi_to_json.py
          git diff --exit-code -- specs/001-api-v1/contracts/openapi.json

      - name: Start IRIS Community
        run: |
          set +e
          # intersystemsdc `latest` (2026.1) starts fine, but its docker-entrypoint.sh runs an after-start
          # script that fails (dbapi.connect) and shuts IRIS down. Calling iris-main directly skips that script.
          # (The 2020.2 tag from the Dockerfile does not start on current runner kernels; the official
          # containers.intersystems.com tag tried earlier could not be pulled.)
          # TZ: the tests run outside UTC on purpose. History rows are keyed in UTC while DateTime is local,
          # and $ZDateTime time format 7 converts local to UTC; on a UTC server those mistakes are invisible.
          docker run -d --name iris -e TZ=America/Sao_Paulo --entrypoint /tini -v "$PWD":/home/irisowner/repo \
            intersystemsdc/iris-community:latest -- /iris-main
          # ready = the container is running and `iris session` no longer reports "inhibited"
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' iris)" != "true" ]; then
              echo "IRIS container exited" >&2; exit 1
            fi
            out=$(docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' 2>&1)
            echo "probe $i: exit=$? ${out:0:80}"
            if [ -z "$out" ] || ! echo "$out" | grep -qi "inhibited\|not running\|error"; then
              docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' >/dev/null 2>&1 && exit 0
            fi
            sleep 2
          done
          echo "IRIS did not become ready in 180 s" >&2
          exit 1

      - name: Load source and run %UnitTest
        run: |
          set +e
          docker exec iris iris session IRIS -U USER \
            '##class(%SYSTEM.OBJ).LoadDir("/home/irisowner/repo/src/cls","ck",,1)' > load.txt 2>&1
          echo "load exit code: $?" >> load.txt
          docker exec iris iris session IRIS -U USER \
            '##class(diashenrique.historymonitor.test.Runner).Run()' > out.txt 2>&1
          echo "run exit code: $?" >> out.txt
          grep -v -E '^(Loading|Imported|Compiling)' load.txt | tail -c 2000 > load.short
          cat load.short out.txt
          msg="$(cat load.short; echo ---; grep -E '^(FAILED_METHOD|FAILED_CASE|TEST_METHODS)' out.txt | tail -n 60)"
          echo "::notice title=unit test log::$(printf '%s' "$msg" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          # A class that does not compile never runs, so the totals alone would hide it.
          if grep -q '^ERROR' load.txt; then echo "source did not compile" >&2; grep '^ERROR' load.txt >&2; exit 1; fi
          grep -q "TEST_METHODS=[1-9][0-9]* FAILED_COUNT=0" out.txt

      - name: Container diagnostics
        if: failure()
        run: |
          {
            echo "== docker ps -a"; docker ps -a
            echo "== inspect state"; docker inspect iris --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}'
            echo "== logs"; docker logs --tail 60 iris 2>&1
            echo "== host"; free -m; df -h / | tail -1
          } > diag.txt 2>&1 || true
          cat diag.txt
          echo "::notice title=container diagnostics::$(tail -c 6000 diag.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"

  ipm-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start IRIS Community
        run: |
          set +e
          docker run -d --name iris --entrypoint /tini -v "$PWD":/home/irisowner/repo \
            intersystemsdc/iris-community:latest -- /iris-main
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' iris)" != "true" ]; then
              echo "IRIS container exited" >&2; exit 1
            fi
            out=$(docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' 2>&1)
            if [ -z "$out" ] || ! echo "$out" | grep -qi "inhibited\|not running\|error"; then
              docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' >/dev/null 2>&1 && exit 0
            fi
            sleep 2
          done
          echo "IRIS did not become ready in 180 s" >&2
          exit 1

      - name: Install IPM, load module.xml, check what was created
        run: |
          set +e
          # IPM is pinned so a new release cannot change this job by itself.
          curl -sSL -f -o zpm.xml https://pm.community.intersystems.com/packages/zpm/0.10.9/installer || { echo "could not download IPM" >&2; exit 1; }
          docker cp zpm.xml iris:/tmp/zpm.xml
          {
            docker exec iris iris session IRIS -U %SYS '##class(%SYSTEM.OBJ).Load("/tmp/zpm.xml","c")'
            docker exec iris iris session IRIS -U USER '##class(%IPM.Main).Shell("load /home/irisowner/repo")'
            docker exec iris iris session IRIS -U %SYS '##class(%SYSTEM.OBJ).Load("/home/irisowner/repo/.github/ci/InstallCheck.cls","ck")'
            docker exec iris iris session IRIS -U %SYS '##class(ci.InstallCheck).Run()'
          } > ipm.txt 2>&1
          # keep only printable text; the raw IPM output carries control characters that break annotations
          sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' ipm.txt | tr -cd '\11\12\40-\176' | grep -E '^(PASS|FAIL|INSTALL_CHECK|\[USER\|iris-history-monitor\].*(FAIL|ERROR))' | cut -c1-200 > summary.txt
          cat summary.txt
          echo "::notice title=ipm install check::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' summary.txt)"
          grep -q '^INSTALL_CHECK=OK' summary.txt

  ipm-upgrade:
    # Spec 003 US2, SC-002: an instance that ran 1.9.3 and used its old pages, upgraded to this commit,
    # keeps nothing of the old pages. 1.9.3 is pinned by commit (use the v1.9.3 tag once it exists).
    runs-on: ubuntu-latest
    env:
      FROM_COMMIT: 900a4217a5aae4d4fff19a7731d73003a794ef81
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out 1.9.3 next to this commit
        run: git worktree add .wt/from "$FROM_COMMIT"

      - name: Start IRIS Community
        run: |
          set +e
          docker run -d --name iris --entrypoint /tini -v "$PWD":/home/irisowner/repo \
            intersystemsdc/iris-community:latest -- /iris-main
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' iris)" != "true" ]; then
              echo "IRIS container exited" >&2; exit 1
            fi
            out=$(docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' 2>&1)
            if [ -z "$out" ] || ! echo "$out" | grep -qi "inhibited\|not running\|error"; then
              docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' >/dev/null 2>&1 && exit 0
            fi
            sleep 2
          done
          echo "IRIS did not become ready in 180 s" >&2
          exit 1

      - name: Install 1.9.3, use an old page, upgrade, check
        run: |
          set +e
          curl -sSL -f -o zpm.xml https://pm.community.intersystems.com/packages/zpm/0.10.9/installer || { echo "could not download IPM" >&2; exit 1; }
          docker cp zpm.xml iris:/tmp/zpm.xml
          {
            docker exec iris iris session IRIS -U %SYS '##class(%SYSTEM.OBJ).Load("/tmp/zpm.xml","c")'
            docker exec iris iris session IRIS -U USER '##class(%IPM.Main).Shell("load /home/irisowner/repo/.wt/from")'
            # An old page as a user would open it, then the scratch data the old pages kept.
            printf '%s\n' 'set r=##class(%Net.HttpRequest).%New(),r.Server="localhost",r.Port=52773,r.Username="_SYSTEM",r.Password="SYS"' \
              'do r.Get("/csp/irismonitor/historylicense.csp") write "OLD_PAGE=",r.HttpResponse.StatusCode,!' \
              'set ^IRISMonitor("ci")=1 write "SEEDED csp.historylicense=",##class(%Dictionary.CompiledClass).%ExistsId("csp.historylicense"),!' 'halt' \
              | docker exec -i iris iris session IRIS -U USER
            docker exec iris iris session IRIS -U USER '##class(%IPM.Main).Shell("load /home/irisowner/repo")'
            docker exec iris iris session IRIS -U %SYS '##class(%SYSTEM.OBJ).Load("/home/irisowner/repo/.github/ci/InstallCheck.cls","ck")'
            docker exec iris iris session IRIS -U %SYS '##class(ci.InstallCheck).Run()'
          } > upgrade.txt 2>&1
          sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' upgrade.txt | tr -cd '\11\12\40-\176' | grep -E '^(OLD_PAGE|SEEDED|Removed|PASS|FAIL|INSTALL_CHECK|\[USER\|iris-history-monitor\].*(FAIL|ERROR))' | cut -c1-200 > summary.txt
          cat summary.txt
          echo "::notice title=ipm upgrade check::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' summary.txt)"
          grep -q '^OLD_PAGE=200' summary.txt && grep -q 'Removed class csp.historylicense' summary.txt && grep -q '^INSTALL_CHECK=OK' summary.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and types
        run: |
          npm run lint
          npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Committed build equals a fresh build
        run: npm run check:build

      - name: First screen size budget
        run: npm run check:size

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start IRIS Community
        run: |
          set +e
          docker run -d --name iris -p 52773:52773 -e TZ=America/Sao_Paulo --entrypoint /tini \
            -v "$PWD":/home/irisowner/repo intersystemsdc/iris-community:latest -- /iris-main
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' iris)" != "true" ]; then
              echo "IRIS container exited" >&2; exit 1
            fi
            out=$(docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' 2>&1)
            if [ -z "$out" ] || ! echo "$out" | grep -qi "inhibited\|not running\|error"; then
              docker exec iris iris session IRIS -U USER '##class(%SYSTEM.Version).GetVersion()' >/dev/null 2>&1 && exit 0
            fi
            sleep 2
          done
          echo "IRIS did not become ready in 180 s" >&2
          exit 1

      - name: Test passwords for this run
        run: |
          echo "HM_VIEWER_PASSWORD=V-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          echo "HM_NOROLE_PASSWORD=N-$(openssl rand -hex 12)" >> "$GITHUB_ENV"

      - name: Install the module with IPM, demo history, users, switch on
        run: sh .github/ci/e2e-setup.sh iris

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: web
        env:
          HM_BASE_URL: http://localhost:52773/historymonitor/
        run: npx playwright test

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t iris-history-monitor:ci .

      - name: Run it and check what a user gets
        run: |
          docker run -d --name hm -p 52773:52773 iris-history-monitor:ci
          for i in $(seq 1 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:52773/historymonitor/index.html)" = 200 ] && break
            sleep 2
          done
          set -e
          curl -sf -o /dev/null http://localhost:52773/historymonitor/index.html
          curl -sf -u _SYSTEM:SYS http://localhost:52773/historymonitor/api/v1/settings | grep -q '"interfaceEnabled":true'
          curl -sf -u _SYSTEM:SYS http://localhost:52773/historymonitor/api/v1/overview | grep -q '"metrics"'
          # The old address forwards to the new monitor (spec 003); no old page is served.
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:52773/csp/irismonitor/historylicense.csp \
            | grep -qx '302 http://localhost:52773/historymonitor/index.html#/history?metric=license'
          echo "image serves the interface and the API, and forwards the old addresses"

      - name: Container log
        if: failure()
        run: docker logs --tail 80 hm
